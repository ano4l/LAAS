[project]
name = "football-ai-analytics"
version = "0.1.0"
description = "End-to-end football video analytics platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "opencv-python>=4.10.0.84",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
modal = ["modal==1.6.2"]
dev = ["pytest>=8", "httpx>=0.28"]
cv = [
  "ultralytics==8.4.178",
  "lap>=0.5.12",
  "imageio-ffmpeg>=0.6.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "workers*"]
exclude = ["references*", "data*", "node_modules*"]

[tool.pytest.ini_options]
addopts = "-p no:xonsh"
